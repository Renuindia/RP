
<section class="entrance" id="entrance">

    <div class="entrance-light"></div>

    <div class="door-frame">

        <!-- Ganesha above entrance -->
        <div class="ganesha-frame">
            <img src="assets/ganesha.png"
                 alt="Lord Ganesha">
        </div>

        <!-- LEFT WOODEN DOOR -->
        <div class="door left-door">

            <div class="wood-panel"></div>
            <div class="lower-panel"></div>

            <div class="door-handle"></div>

        </div>

        <!-- RIGHT WOODEN DOOR -->
        <div class="door right-door">

            <div class="wood-panel"></div>
            <div class="lower-panel"></div>

            <div class="door-handle"></div>

        </div>

    </div>

    <p style="
        color:#96732d;
        letter-spacing:5px;
        margin-top:40px;
        font-style:italic;
        text-align:center;">
        Scroll or Tap to Open
    </p>

    <button onclick="openWeddingDoors()"
        style="
        background:#bd963b;
        color:white;
        border:none;
        padding:15px 30px;
        border-radius:30px;
        cursor:pointer;">
        Open Invitation
    </button>

</section>
